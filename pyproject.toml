# SPDX-License-Identifier: MIT
[project]
name = "underwater-color"
version = "0.1.0"
description = "Underwater photo and video color correction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Matt Kulukundis", email = "matt@brontosource.dev"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "opencv-python>=4.6",
    "Pillow",
]

[project.urls]
# This repo has NO GitHub remote yet — it is a local jj repo, and the URL
# below is the intended home, not an existing page. Confirm (or create) it
# before the first upload to PyPI; a dead Homepage link ships otherwise.
Homepage = "https://github.com/fowles/underwater-color"
Source = "https://github.com/fowles/underwater-color"

[project.optional-dependencies]
# DICAM is the one learned method. torch is heavy and most callers want only
# the closed-form generators, so it is an extra rather than a dependency.
# There is deliberately no [video] extra: ffmpeg is a system binary, not a
# wheel, and its absence is reported at runtime by video.preflight().
# requests lives here too: it is used only to download the DICAM checkpoint.
dicam = ["torch", "requests"]

[project.scripts]
underwater-color = "underwater_color.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
    "torch>=2.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["underwater_color"]
